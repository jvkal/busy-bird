<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Busy Bird</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <span class="dot" id="dot" title="正在连接"></span>
    <button class="pill hot" id="pill" title="单击切换时间窗">— tok</button>
    <button class="mini-dot hot" id="statDot" title="用量统计">📊</button>
    <button class="gear hot" id="gear" title="设置（右键卡片也可换装）">⚙</button>
  </header>

  <div class="panel" id="statsCard">
    <div class="panel-head">
      <span>用量统计</span>
      <button class="panel-close" id="statsClose" title="关闭">✕</button>
    </div>
    <div class="stat-grid">
      <div class="stat"><span class="stat-v" id="stCalls">—</span><span class="stat-k">今日调用</span></div>
      <div class="stat"><span class="stat-v" id="stTotal">—</span><span class="stat-k">请求总数</span></div>
      <div class="stat"><span class="stat-v" id="stCost">—</span><span class="stat-k">费用参考</span></div>
      <div class="stat"><span class="stat-v" id="stSpeed">—</span><span class="stat-k">输出速度</span></div>
      <div class="stat"><span class="stat-v" id="stSess">—</span><span class="stat-k">会话数</span></div>
    </div>
    <svg id="chart" viewBox="0 0 240 52" preserveAspectRatio="none"></svg>
    <div class="chart-cap">近 24 小时 · 每小时调用量</div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-head">
      <span>设置</span>
      <button class="panel-close" id="panelClose" title="关闭">✕</button>
    </div>
    <div class="panel-row">
      <label for="opSlider">不透明度</label>
      <input type="range" id="opSlider" min="20" max="100" step="5">
      <output id="opVal">34%</output>
    </div>
    <div class="panel-row">
      <label>主题颜色</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="panel-row">
      <label for="customColor">自定义</label>
      <input type="color" id="customColor" value="#a18bff">
      <button class="mini" id="resetPlace" title="回到屏幕正中间，恢复默认大小">恢复默认位置和大小</button>
    </div>
  </div>

  <div id="island" class="hot" title="拖动可离开屏幕顶部 · 滚轮/双击切换会话">
    <svg viewBox="0 0 230 44" width="230" height="44" aria-hidden="true">
      <line class="isl-track" x1="38" y1="30" x2="192" y2="30"/>
      <g id="islLights"></g>
      <circle id="islPacket" class="isl-hold" r="2.4" opacity="0"/>
      <g id="islBirds"></g>
      <g class="isl-end" id="islLeft" transform="translate(38 30)"></g>
      <g class="isl-end" id="islRight" transform="translate(192 30)"></g>
      <g id="islDots"></g>
    </svg>
  </div>

  <svg id="sky" viewBox="0 0 260 160" aria-hidden="true">
    <defs>
      <radialGradient id="glowGrad">
        <stop offset="0" class="glow-a"/>
        <stop offset="0.7" class="glow-b"/>
        <stop offset="1" class="glow-c"/>
      </radialGradient>
    </defs>
    <g id="wires"></g>
    <g id="chips"></g>
    <g id="hub"></g>
    <g id="fx"></g>
    <g id="birds"></g>
  </svg>
  <script type="module" src="app.js"></script>
</body>
</html>
